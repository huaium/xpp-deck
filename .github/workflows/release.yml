name: Release

on:
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Tag name to create (e.g., v1.0.0)"
                required: true

jobs:
    build-and-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: read

        steps:
            - name: Checkout Code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # checkout v6.0.2
              with:
                  fetch-depth: 0 # Retrieve full history.

            - name: Set Up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # setup-node v6
              with:
                  node-version: 24

            - name: Set Up pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # action-setup v4

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Set Up Recoverable Build Cleanup
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes trash-cli
                  mkdir -p "$RUNNER_TEMP/bin"
                  ln -s "$(command -v trash-put)" "$RUNNER_TEMP/bin/trash"
                  echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

            - name: Validate and Package With WXT
              run: |
                  pnpm run lint
                  pnpm test
                  pnpm run build

            - name: Fetch Latest Merged PR Infomation
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # Get title and body of the latest merged PR.
                  gh pr list --state merged --base Release --limit 1 --json title,body --template \
                  '{{ range . }}# {{ .title }}{{ "\n\n" }}{{ .body }}{{ end }}' > release_notes.md

            - name: Create Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG_NAME: ${{ github.event.inputs.tag_name }}
              run: |
                  gh release create "$TAG_NAME" \
                    ./.output/*.zip \
                    --title "Release $TAG_NAME" \
                    --notes-file release_notes.md \
                    --draft
