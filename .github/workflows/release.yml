name: Release

on:
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Tag name to create (e.g., v1.0.0)"
                required: true

jobs:
    build-and-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: read

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # Retrieve full history.

            - name: Set Up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Set Up pnpm
              uses: pnpm/setup@v3
              with:
                  require-lockfile: true

            - name: Validate and Package With WXT
              run: |
                  pnpm run lint
                  pnpm test
                  pnpm run build

            - name: Fetch Latest Merged PR Infomation
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # Get title and body of the latest merged PR.
                  gh pr list --state merged --base Release --limit 1 --json title,body --template \
                  '{{ range . }}# {{ .title }}{{ "\n\n" }}{{ .body }}{{ end }}' > release_notes.md

            - name: Create Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG_NAME: ${{ github.event.inputs.tag_name }}
              run: |
                  gh release create "$TAG_NAME" \
                    ./.output/*.zip \
                    --title "Release $TAG_NAME" \
                    --notes-file release_notes.md \
                    --draft
