name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Tag name to create (e.g., v1.0.0)"
                required: true

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            tag_name: ${{ steps.preview.outputs.tag_name }}

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # Retrieve full history.

            - name: Set Up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Set Up pnpm
              uses: pnpm/setup@v3
              with:
                  require-lockfile: true

            - name: Validate and Package With WXT
              run: |
                  pnpm run lint
                  pnpm test
                  pnpm run build

            - name: Fetch Latest Merged PR Infomation
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # Get title and body of the latest merged PR.
                  gh pr list --state merged --base Release --limit 1 --json title,body --template \
                  '{{ range . }}# {{ .title }}{{ "\n\n" }}{{ .body }}{{ end }}' > release_notes.md

            - name: Preview Release for Approval
              id: preview
              env:
                  TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
              run: |
                  echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
                  if [ ! -s release_notes.md ]; then
                    printf 'Release %s\n' "$TAG_NAME" > release_notes.md
                  fi
                  {
                    printf '## Proposed release: %s\n\n' "$TAG_NAME"
                    echo 'Review the description and packaged extensions below before approving the release job.'
                    echo
                    cat release_notes.md
                    printf '\n\n### Downloads\n\n'
                    find .output -maxdepth 1 \( -name '*-chrome.zip' -o -name '*-firefox.zip' \) -printf '- `%f`\n'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Save Release Packages and Description
              uses: actions/upload-artifact@v7
              with:
                  name: release-candidate
                  path: |
                      .output/*-chrome.zip
                      .output/*-firefox.zip
                      release_notes.md
                  include-hidden-files: true
                  if-no-files-found: error

    publish:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: release
            url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        permissions:
            contents: write
        steps:
            - name: Download Approved Release Candidate
              uses: actions/download-artifact@v8
              with:
                  name: release-candidate

            - name: Publish Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG_NAME: ${{ needs.build.outputs.tag_name }}
              run: |
                  gh release create "$TAG_NAME" \
                    ./.output/*-chrome.zip \
                    ./.output/*-firefox.zip \
                    --title "Release $TAG_NAME" \
                    --notes-file release_notes.md \
                    --target "$GITHUB_SHA"
